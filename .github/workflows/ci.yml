name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
      - run: sudo apt-get update && sudo apt-get install -y libmp3lame-dev ffmpeg
      - run: go vet ./...
      - run: go build ./...
      - env:
          CGO_ENABLED: "1"
        run: go test -race ./...
