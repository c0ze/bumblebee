server:
  addr: ":8080"
cache:
  default_backend: memory
  memory: { max_bytes: 256MB }
  disk: { dir: ./.bumblebee-cache, max_bytes: 20GB }
routes:
  - path: /video/*
    upstream:
      method: GET
      url: "https://origin.example.com/{path}"
      pool: ["origin.example.com"]
      timeout: 300s
    cache:
      backend: disk
      ttl: 720h
    pipeline:
      - type: video
        params: { format: mp4, codec: libx264, crf: 23, preset: medium }
        overrides: { crf: crf, scale: scale }
